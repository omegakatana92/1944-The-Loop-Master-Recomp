# 1944: The Loop Master (Capcom / Eighting-Raizing 2000, CPS-2 arcade board): per-game settings read by
# the cps2recomp toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = 1944: The Loop Master
# What the window is called (the name stays the folder the player's settings are kept under)
title = 1944 Recomp
id = 1944
# Reverse-DNS app identifier (macOS bundle id / launcher). Change the "loopmasterrecomp" part to your own.
app_id = io.github.loopmasterrecomp
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# 1944 has no parent set, so rom_parent is the set itself.
rom_set = 1944
rom_parent = 1944
rom_name = 1944: The Loop Master (Europe 000620)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words).
# sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = nffe.03:7544b926 nffe.04:dba1c66e nffe.05:d78d31d3
graphics = nff.13m:c9fca741 nff.15m:f809d898 nff.17m:15ba4507 nff.19m:3dd41b8c nff.14m:3fe3a54b nff.16m:565cd231 nff.18m:63ca5988 nff.20m:21eb8f3b
sound_program = nff.01:d2e44318
samples = nff.11m:243e4e05 nff.12m:4fcf1600
key = 1944.key:5f22140e

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The
# maincpu region holds 1.5 MiB (three 512 KiB ROMs: nffe.03/04/05), so this spans the whole program.
code_end = 180000
